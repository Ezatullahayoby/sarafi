      (function() {
        try {
          // Safeguard for iframe environments where window.fetch is getter-only:
          // Ensure window.fetch has both a getter and a setter so external instrumentation or proxies don't throw TypeError
          var originalFetch = typeof window !== 'undefined' && typeof window.fetch === 'function'
            ? window.fetch.bind(window)
            : undefined;
          var _fetch = originalFetch;

          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _fetch;
              },
              set: function(val) {
                _fetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return _fetch;
                  },
                  set: function(val) {
                    _fetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }

          // Error event suppression if any script still triggers "Cannot set property fetch"
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (err) {}
      })();
    </script>
